<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0e0e0e;
      font-family: 'Rubik', sans-serif;
      padding: 24px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }

    h1 {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      color: #f0f0f0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
      text-align: center;
    }

    h1 span {
      color: #f5a623;
    }

    .fields {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }

    .field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.72rem;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input[type="text"] {
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 14px;
      color: #f0f0f0;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #f5a623;
    }

    .ops {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button[type="submit"] {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px;
      color: #ccc;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.1s;
      letter-spacing: 0.06em;
    }

    button[type="submit"]:hover {
      background: #f5a623;
      border-color: #f5a623;
      color: #0e0e0e;
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Calcu<span>ladora</span></h1>
    <form action="http://localhost:8000" method="POST">
      <div class="fields">
        <div class="field">
          <label for="valor1">Valor 1</label>
          <input type="text" id="valor1" name="valor1" placeholder="0" required>
        </div>
        <div class="field">
          <label for="valor2">Valor 2</label>
          <input type="text" id="valor2" name="valor2" placeholder="0" required>
        </div>
      </div>
      <div class="ops">
        <button type="submit" name="operacao" value="adicao">+ Adição</button>
        <button type="submit" name="operacao" value="subtracao">− Subtração</button>
        <button type="submit" name="operacao" value="multiplicacao">× Multiplicação</button>
        <button type="submit" name="operacao" value="divisao">÷ Divisão</button>
      </div>
    </form>
  </div>
</body>
</html>
